name: Exitbind Evals / Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Assert Python >= 3.11
        run: |
          python3 - <<'PY'
          import sys
          assert sys.version_info >= (3, 11), sys.version
          PY

      - name: Check shell syntax
        run: bash -n scripts/reproduce.sh runners/collect-environment runners/export-public runners/run-case runners/run-suite

      - name: Compile evaluator Python
        run: |
          python3 -m py_compile adapters/*.py runners/*.py tools/*.py tests/*.py
          python3 -m py_compile scenarios/*.py scenarios/*/fixtures/*.py

      - name: Run evaluator tests
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v

      - name: Validate evaluator data
        run: python3 tools/validate.py

      - name: Run external-trust scenario suite (fixture variant)
        run: |
          python3 runners/run_scenarios.py --variant fixture --out "$RUNNER_TEMP/scenario-results"
          python3 - "$RUNNER_TEMP/scenario-results" <<'PY'
          import json, pathlib, sys
          summary = json.loads(pathlib.Path(sys.argv[1], "summary.json").read_text(encoding="utf-8"))
          assert summary["schema_version"] == "scenario-suite-v1", summary["schema_version"]
          assert summary["variant"] == "fixture", summary["variant"]
          assert summary["scenario_count"] > 0, "no scenarios found"
          bad = {k: v for k, v in summary["outcomes"].items() if v != "pass"}
          assert not bad, f"scenarios did not pass: {bad}"
          print(f"scenario suite: {summary['scenario_count']} scenarios, all pass")
          PY

      - name: harness self-test
        run: ./scripts/reproduce.sh
